<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Savings By Grid</title>
<style>html,body{margin:0;padding:0;background:#0d1620;height:100%;overflow:hidden}svg{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1920" height="1080" fill="#0d1620"/>
<text x="175" y="96" fill="#eef4f9" font-size="46" font-weight="700">How much you save depends on your grid.</text>
<text x="175" y="150" fill="#7d9bb3" font-size="26">Five real grid zones, measured. A flat grid has less to give &#8212; and CarbonShift tells you so.</text>
<text x="175" y="228" fill="#4a687f" font-size="19" font-weight="600" letter-spacing="1.5">GRID ZONE</text>
<text x="700" y="228" fill="#4a687f" font-size="19" font-weight="600" letter-spacing="1.5">REALISTIC SAVING ON A SHIFTED JOB</text>
<line x1="890.0" y1="248" x2="890.0" y2="858" stroke="#1c2b38" stroke-width="1.5"/>
<text x="890.0" y="886" fill="#3f5c72" font-size="18" text-anchor="middle">10%</text>
<line x1="1080.0" y1="248" x2="1080.0" y2="858" stroke="#1c2b38" stroke-width="1.5"/>
<text x="1080.0" y="886" fill="#3f5c72" font-size="18" text-anchor="middle">20%</text>
<line x1="1270.0" y1="248" x2="1270.0" y2="858" stroke="#1c2b38" stroke-width="1.5"/>
<text x="1270.0" y="886" fill="#3f5c72" font-size="18" text-anchor="middle">30%</text>
<line x1="1460.0" y1="248" x2="1460.0" y2="858" stroke="#1c2b38" stroke-width="1.5"/>
<text x="1460.0" y="886" fill="#3f5c72" font-size="18" text-anchor="middle">40%</text>
<line x1="1650.0" y1="248" x2="1650.0" y2="858" stroke="#1c2b38" stroke-width="1.5"/>
<text x="1650.0" y="886" fill="#3f5c72" font-size="18" text-anchor="middle">50%</text>
<text x="175" y="298" fill="#eef4f9" font-size="31" font-weight="600">Germany</text>
<text x="175" y="330" fill="#6b8ba5" font-size="20">DE &#183; 2.6&#215; between its dirtiest and cleanest hour</text>
<rect x="700" y="268" width="950" height="58" rx="8" fill="#16242f"/>
<rect x="700" y="268" width="950.0" height="58" rx="8" fill="#4ade80"/>
<text x="1676.0" y="309" fill="#4ade80" font-size="34" font-weight="700">50%</text>
<text x="175" y="424" fill="#eef4f9" font-size="31" font-weight="600">Britain</text>
<text x="175" y="456" fill="#6b8ba5" font-size="20">GB &#183; 2.5&#215; between its dirtiest and cleanest hour</text>
<rect x="700" y="394" width="950" height="58" rx="8" fill="#16242f"/>
<rect x="700" y="394" width="855.0" height="58" rx="8" fill="#74d07d"/>
<text x="1581.0" y="435" fill="#74d07d" font-size="34" font-weight="700">45%</text>
<text x="175" y="550" fill="#eef4f9" font-size="31" font-weight="600">South India</text>
<text x="175" y="582" fill="#6b8ba5" font-size="20">IN-SO &#183; 1.5&#215; between its dirtiest and cleanest hour</text>
<rect x="700" y="520" width="950" height="58" rx="8" fill="#16242f"/>
<rect x="700" y="520" width="570.0" height="58" rx="8" fill="#b9c95f"/>
<text x="1296.0" y="561" fill="#b9c95f" font-size="34" font-weight="700">30%</text>
<text x="175" y="676" fill="#eef4f9" font-size="31" font-weight="600">West India</text>
<text x="175" y="708" fill="#6b8ba5" font-size="20">IN-WE &#183; 1.4&#215; between its dirtiest and cleanest hour</text>
<rect x="700" y="646" width="950" height="58" rx="8" fill="#16242f"/>
<rect x="700" y="646" width="475.0" height="58" rx="8" fill="#d6b154"/>
<text x="1201.0" y="687" fill="#d6b154" font-size="34" font-weight="700">25%</text>
<text x="175" y="802" fill="#eef4f9" font-size="31" font-weight="600">US Mid-Atlantic</text>
<text x="175" y="834" fill="#6b8ba5" font-size="20">PJM &#183; 1.2&#215; between its dirtiest and cleanest hour</text>
<rect x="700" y="772" width="950" height="58" rx="8" fill="#16242f"/>
<rect x="700" y="772" width="228.0" height="58" rx="8" fill="#e0894e"/>
<text x="954.0" y="813" fill="#e0894e" font-size="34" font-weight="700">12%</text>
<line x1="175" y1="928" x2="1745" y2="928" stroke="#22323f" stroke-width="2"/>
<text x="175" y="976" fill="#9fb8cb" font-size="23"><tspan fill="#4ade80" font-weight="600">We demo on the German grid</tspan><tspan> because it swings the most. The Indian grids are flatter, so the saving is smaller &#8212; the tool reports that</tspan></text>
<text x="175" y="1010" fill="#9fb8cb" font-size="23">honestly rather than inflating it. A tool that promised 50% everywhere would be lying to you.</text>
</svg>
</body>
</html>
